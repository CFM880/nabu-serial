schema = 1

[module]
name        = "nabu-serial"
description = "USB CDC-ACM serial debug console (configfs gadget + kernel console)"
requires    = []

[provides]
overlay   = "kernel-overlay"
config    = ["config/nabu-serial.config"]
systemd   = ["system/nabu-usb-console.service"]
userspace = ["libexec/nabu-usb-console.sh"]

# Userspace builds the gadget (libexec/nabu-usb-console.sh) and the consumer's
# kernel command line carries "console=ttyGS0", which is what routes printk to
# the gadget.  The overlay exists only to enlarge the console fifo
# (GS_CONSOLE_BUF_SIZE) so a full WARN dump survives the USB pipe.

[install]
"systemd/nabu-usb-console.service" = "/etc/systemd/system/nabu-usb-console.service"
"userspace/nabu-usb-console.sh"    = "/usr/local/libexec/nabu-usb-console.sh"
