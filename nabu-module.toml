schema = 1

[module]
name        = "nabu-serial"
description = "USB CDC-ACM serial debug console (configfs gadget + kernel console)"
requires    = []

[provides]
config    = ["config/nabu-serial.config"]
systemd   = ["system/nabu-usb-console.service"]
userspace = ["libexec/nabu-usb-console.sh"]

# No kernel tree of its own: the configfs ACM function is enough, userspace
# builds the gadget (libexec/nabu-usb-console.sh).  The kernel command line of
# the consumer (debian/config/debian.cmdline carries "console=ttyGS0") is what
# routes printk to the gadget.

[install]
"systemd/nabu-usb-console.service" = "/etc/systemd/system/nabu-usb-console.service"
"userspace/nabu-usb-console.sh"    = "/usr/local/libexec/nabu-usb-console.sh"
